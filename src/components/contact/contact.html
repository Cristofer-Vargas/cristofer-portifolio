<section id="contato" class="section-wrap reveal" aria-labelledby="contato-title">
  <article class="pixel-card pixel-shadow">
    <h2 id="contato-title" class="section-title">Contato</h2>

    <div class="contact-grid">
      <div class="contact-info">
        <p class="contact-intro">
          Aberto a oportunidades como <strong class="hl">Desenvolvedor Web Full Stack</strong>,
          projetos em <strong class="hl">.NET / C#</strong>, interfaces <strong class="hl">UI/UX</strong>
          e colaborações open source.
        </p>

        <address class="contact-address">
          <ul class="contact-details">
            <li>
              <span class="contact-label">Localização</span>
              <span class="contact-value">São Luiz Gonzaga — RS, Brasil</span>
            </li>
            <li>
              <span class="contact-label">GitHub</span>
              <a
                href="https://github.com/Cristofer-Vargas"
                target="_blank"
                rel="noopener noreferrer"
                class="contact-link"
              >
                github.com/Cristofer-Vargas
              </a>
            </li>
            <li>
              <span class="contact-label">Projeto Destaque</span>
              <a
                href="https://github.com/Cristofer-Vargas/LudoVault"
                target="_blank"
                rel="noopener noreferrer"
                class="contact-link"
              >
                github.com/Cristofer-Vargas/LudoVault
              </a>
            </li>
          </ul>
        </address>

        <div class="contact-actions">
          <button type="button" class="pixel-btn pixel-btn--primary" id="copy-github-btn">
            Copiar link do GitHub
          </button>
        </div>
      </div>

      <form class="contact-form" id="contact-form" novalidate>
        <div class="form-field">
          <label for="contact-name">Nome</label>
          <input type="text" id="contact-name" name="name" placeholder="Seu nome" autocomplete="name" required>
        </div>
        <div class="form-field">
          <label for="contact-subject">Assunto</label>
          <input type="text" id="contact-subject" name="subject" placeholder="Oportunidade, projeto ou dúvida" required>
        </div>
        <div class="form-field">
          <label for="contact-message">Mensagem</label>
          <textarea id="contact-message" name="message" rows="4" placeholder="Escreva sua mensagem..." required></textarea>
        </div>
        <button type="submit" class="pixel-btn pixel-btn--primary pixel-btn--full">
          Preparar Mensagem
        </button>
        <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </article>
</section>

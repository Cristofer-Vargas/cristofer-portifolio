<section id="projetos" class="projects-band reveal" aria-labelledby="projetos-title">
  <div class="projects-band__header ds-vault-head">
    <div class="vault-badge-row ds-vault-badges">
      <span class="badge-accent">ARCHIVE // REPOSITÓRIO</span>
      <span class="badge-xp">CARGO DELIVERIES</span>
    </div>
    <h2 id="projetos-title" class="section-title section-title--center">Bridges Archive // Projetos &amp; Entregas</h2>
    <p class="projects-vault-sub ds-vault-sub">Selecione um módulo para inspecionar arquitetura técnica, telemetria e repositório</p>

    <div class="carousel-controls ds-carousel-controls" aria-label="Controles do carrossel de projetos">
      <button type="button" class="pixel-btn carousel-nav-btn ds-nav-arrow" id="carousel-prev" aria-label="Projeto anterior">◀ PREV</button>
      <div class="carousel-dots ds-carousel-dots" id="carousel-dots" role="tablist" aria-label="Selecionar projeto"></div>
      <button type="button" class="pixel-btn carousel-nav-btn ds-nav-arrow" id="carousel-next" aria-label="Próximo projeto">NEXT ▶</button>
    </div>
  </div>

  <div class="carousel-viewport ds-carousel-viewport" id="carousel-viewport" tabindex="0" aria-roledescription="carousel" aria-label="Projetos em destaque">
    <div class="carousel-track ds-carousel-track" id="carousel-track">
      <!-- Populated dynamically via carousel.component.js -->
    </div>
  </div>
</section>

<!-- Project Detail Modal -->
<div class="modal ds-modal" id="project-modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal__backdrop ds-modal__backdrop" data-close-modal="true"></div>
  <div class="modal__dialog ds-modal__dialog">
    <button type="button" class="modal__close pixel-btn ds-modal__close" id="modal-close" aria-label="Fechar detalhes">✕</button>
    <span class="modal__category ds-modal__cat" id="modal-category"></span>
    <h2 class="modal__title ds-modal__title" id="modal-title"></h2>
    <div class="modal__preview ds-modal__preview" id="modal-preview"></div>
    <h3 class="modal__subtitle ds-modal__subtitle">Descrição</h3>
    <p class="modal__desc ds-modal__desc" id="modal-desc"></p>
    <h3 class="modal__subtitle ds-modal__subtitle">Tecnologias</h3>
    <ul class="modal__tags ds-modal__tags" id="modal-tags"></ul>
    <div class="modal__actions ds-modal__actions" id="modal-actions"></div>
  </div>
</div>

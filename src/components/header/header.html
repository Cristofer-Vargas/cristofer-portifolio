<header class="site-header ds-hud" id="topo">
  <!-- Death Stranding Odradek & Chiral Network Telemetry Ribbon -->
  <div class="site-header__telemetry-line" aria-hidden="true">
    <div class="ds-telemetry-inner">
      <span class="ds-telemetry-tick">+</span>
      <span class="ds-telemetry-coord">BRIDGES UCA-RS // LAT -29.68° LON -53.80°</span>
      <span class="ds-telemetry-divider">|</span>
      <span class="ds-chiral-status">
        <span class="ds-pulse-dot"></span>
        <span class="ds-chiral-text">CHIRAL NETWORK // CONNECTED</span>
      </span>
      <span class="ds-telemetry-divider">|</span>
      <span class="ds-telemetry-odradek">ODRADEK: SCANNING OPTIMAL</span>
      <span class="ds-telemetry-tick">+</span>
    </div>
  </div>

  <div class="site-header__inner">
    <!-- Player HUD Left: Bridges Porter Terminal -->
    <div class="header-hud ds-porter-hud">
      <a
        href="https://github.com/Cristofer-Vargas"
        class="brand-github ds-brand-github"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Perfil do GitHub de Cristofer Vargas"
        title="Bridges ID Terminal // Ver GitHub"
      >
        <span class="ds-brand-cut" aria-hidden="true"></span>
        <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor" aria-hidden="true">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12Z" />
        </svg>
      </a>

      <div class="player-status ds-player-status">
        <div class="player-tag ds-player-tag">
          <span class="status-dot ds-status-dot" aria-hidden="true"></span>
          <span class="ds-id-sub">BRIDGES //</span>
          <span class="player-name ds-player-name">CRISTOFER</span>
          <span class="ds-rank-pill">GRADE 24</span>
        </div>
        <div class="player-hud-bars ds-hud-bars" aria-label="Status de carga e estamina do desenvolvedor">
          <div class="ds-gauge" title="Estamina: 100%">
            <span class="ds-gauge-tag">STM</span>
            <div class="ds-meter ds-meter--cyan" aria-hidden="true">
              <span class="is-filled"></span>
              <span class="is-filled"></span>
              <span class="is-filled"></span>
              <span class="is-filled"></span>
              <span class="is-filled"></span>
              <span class="is-filled"></span>
            </div>
          </div>
          <div class="ds-gauge" title="Chiral Network Sync: 100%">
            <span class="ds-gauge-tag ds-gauge-tag--gold">SYNC</span>
            <div class="ds-meter ds-meter--gold" aria-hidden="true">
              <span class="is-filled"></span>
              <span class="is-filled"></span>
              <span class="is-filled"></span>
              <span class="is-filled"></span>
              <span class="is-filled"></span>
              <span class="is-filled"></span>
            </div>
          </div>
          <span class="hud-stat ds-great-deliverer">★ GREAT DELIVERER</span>
        </div>
      </div>
    </div>

    <!-- Controls Right -->
    <div class="header-actions ds-header-actions">
      <!-- Odradek Audio Transceiver Toggle -->
      <button
        type="button"
        class="sfx-toggle ds-sfx-btn"
        id="sfx-toggle"
        aria-label="Alternar áudio e efeitos sonoros"
        title="Alternar transceptor de áudio Odradek"
      >
        <span class="ds-audio-waves" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
        </span>
        <span class="sfx-icon" id="sfx-icon" aria-hidden="true" style="display: none;">🔊</span>
        <span class="sfx-label ds-sfx-label" id="sfx-label">SFX: ON</span>
      </button>

      <button
        type="button"
        class="menu-toggle ds-menu-btn"
        id="menu-toggle"
        aria-expanded="false"
        aria-controls="primary-nav"
        aria-label="Abrir menu de navegação"
      >
        <span class="menu-toggle__text">HUD NAV</span>
        <span class="menu-toggle__bars ds-menu-bars" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </span>
      </button>

      <nav class="primary-nav ds-primary-nav" id="primary-nav" aria-label="Navegação principal">
        <a href="#sobre" class="nav-link ds-nav-item">
          <span class="nav-num ds-nav-idx">[01]</span>
          <span class="ds-nav-title">Bio</span>
        </a>
        <a href="#trajetoria" class="nav-link ds-nav-item">
          <span class="nav-num ds-nav-idx">[02]</span>
          <span class="ds-nav-title">Logs</span>
        </a>
        <a href="#projetos" class="nav-link ds-nav-item">
          <span class="nav-num ds-nav-idx">[03]</span>
          <span class="ds-nav-title">Vault</span>
        </a>
        <a href="#tecnologias" class="nav-link ds-nav-item">
          <span class="nav-num ds-nav-idx">[04]</span>
          <span class="ds-nav-title">Arsenal</span>
        </a>
        <a href="#contato" class="nav-link nav-link--highlight ds-nav-item ds-nav-item--chiral">
          <span class="nav-num ds-nav-idx">[05]</span>
          <span class="ds-nav-title">Comms ↗</span>
        </a>
      </nav>
    </div>
  </div>
</header>

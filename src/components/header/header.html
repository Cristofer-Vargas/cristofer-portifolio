<header class="site-header skyrim-hud" id="topo">
  <!-- Subtle Nordic Frost & Mist Overlay -->
  <div class="skyrim-mist-overlay" aria-hidden="true"></div>

  <!-- Authentic Vegvisir Runic Compass Ambient Watermark -->
  <div class="skyrim-ambient-vegvisir" aria-hidden="true">
    <svg viewBox="0 0 120 120" width="120" height="120" fill="none" stroke="currentColor">
      <circle cx="60" cy="60" r="54" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.35" />
      <circle cx="60" cy="60" r="48" stroke-width="0.5" opacity="0.25" />
      <!-- 8 Runic Staves -->
      <path d="M60 12 V108 M12 60 H108 M26 26 L94 94 M26 94 L94 26" stroke-width="1" opacity="0.4" />
      <!-- Branch Tines -->
      <path d="M54 20 H66 M56 26 H64 M54 100 H66 M56 94 H64 M20 54 V66 M26 56 V64 M100 54 V66 M94 56 V64" stroke-width="0.8" opacity="0.5" />
      <path d="M30 36 L36 30 M84 90 L90 84 M30 84 L36 90 M84 30 L90 36" stroke-width="0.8" opacity="0.5" />
      <circle cx="60" cy="60" r="4" fill="currentColor" opacity="0.6" />
    </svg>
  </div>

  <!-- =========================================================================
       1. Top Skyrim Horizon Compass (Bússola Nórdica dos Dragões)
       ========================================================================= -->
  <div class="skyrim-compass-ribbon" aria-label="Bússola Nórdica e Marcadores de Skyrim">
    <!-- Left Nordic Interlace Knot Wing -->
    <div class="skyrim-knot-wing skyrim-knot-wing--left" aria-hidden="true">
      <svg viewBox="0 0 160 20" width="160" height="20" fill="none" stroke="currentColor">
        <path d="M0 10 H80 Q100 2 120 10 T160 10" stroke-width="1" stroke-opacity="0.3" />
        <path d="M100 4 Q115 16 130 4 T160 10" stroke-width="0.75" stroke-opacity="0.5" />
        <circle cx="156" cy="10" r="2.5" fill="currentColor" fill-opacity="0.6" />
      </svg>
    </div>

    <!-- Center Compass Tape & Runes -->
    <div class="skyrim-compass-core">
      <!-- Elder Futhark Sacred Rune Band -->
      <div class="skyrim-rune-band" aria-hidden="true">
        <span class="rune-glyph">᛭</span>
        <span class="rune-glyph">ᚠ</span>
        <span class="rune-glyph">ᚱ</span>
        <span class="rune-glyph">ᛟ</span>
        <span class="rune-glyph">ᛋ</span>
        <span class="rune-glyph">ᛏ</span>
        <span class="rune-dot">᛫</span>
        <span class="rune-word">DOVAHKIIN</span>
        <span class="rune-dot">᛫</span>
        <span class="rune-glyph">ᛋ</span>
        <span class="rune-glyph">ᚲ</span>
        <span class="rune-glyph">ᛁ</span>
        <span class="rune-glyph">ᚱ</span>
        <span class="rune-glyph">ᛁ</span>
        <span class="rune-glyph">ᛗ</span>
        <span class="rune-dot">᛫</span>
        <span class="rune-word">THU'UM</span>
        <span class="rune-glyph">᛭</span>
      </div>

      <!-- The Horizontal Compass Tape with Skyrim Markers -->
      <div class="skyrim-compass-bar">
        <!-- Center Needle / Reticle -->
        <div class="compass-pointer" aria-hidden="true">
          <svg viewBox="0 0 12 10" width="12" height="10" fill="currentColor">
            <polygon points="6,9 1,1 11,1" />
          </svg>
        </div>

        <div class="compass-tape">
          <span class="tape-tick">|</span>
          <span class="tape-point">SW</span>
          <span class="tape-tick">.</span>
          <span class="tape-tick">|</span>
          <span class="tape-point">W</span>
          <span class="tape-tick">.</span>

          <!-- Location Marker: Ancient Nord Barrow / Tomb -->
          <span class="compass-marker marker--barrow" title="Tumba Nórdica Antiga">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor">
              <path d="M2 13 L8 3 L14 13 H11 L8 7 L5 13 Z M7 9 H9 V13 H7 Z" />
            </svg>
          </span>

          <span class="tape-tick">|</span>
          <span class="tape-point">NW</span>
          <span class="tape-tick">.</span>

          <!-- Location Marker: Player Custom Waypoint (Icy Cyan Pin) -->
          <span class="compass-marker marker--waypoint" title="Ponto de Destino Chiral / Waypoint">
            <svg viewBox="0 0 16 16" width="13" height="13" fill="currentColor">
              <polygon points="8,1 12,6 8,11 4,6" />
              <line x1="8" y1="11" x2="8" y2="15" stroke="currentColor" stroke-width="1.5" />
            </svg>
          </span>

          <span class="tape-tick">|</span>

          <!-- MAIN ACTIVE SKYRIM QUEST DIAMOND MARKER (Golden Chevron) -->
          <span class="compass-marker marker--quest" title="Missão Ativa: Explorar Portfólio">
            <svg viewBox="0 0 18 22" width="16" height="20" fill="none">
              <!-- Outer Golden Diamond -->
              <polygon points="9,2 16,10 9,18 2,10" fill="#e5c158" stroke="#ffffff" stroke-width="1" />
              <!-- Inner Shadow -->
              <polygon points="9,5 13,10 9,15 5,10" fill="#121620" />
              <!-- Downward Arrow Point -->
              <polygon points="6,18 12,18 9,22" fill="#e5c158" />
            </svg>
          </span>

          <!-- Cardinal North (Highlighted) -->
          <span class="tape-point tape-point--north">
            <span class="north-letter">N</span>
            <span class="north-rune">ᚾ</span>
          </span>

          <span class="tape-tick">|</span>

          <!-- Location Marker: Dragon Shrine / High Hrothgar -->
          <span class="compass-marker marker--dragon" title="Santuário do Dragão // High Hrothgar">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor">
              <path d="M8 1 L10 5 L15 7 L11 10 L12 15 L8 12 L4 15 L5 10 L1 7 L6 5 Z" />
            </svg>
          </span>

          <span class="tape-tick">.</span>
          <span class="tape-point">NE</span>
          <span class="tape-tick">|</span>

          <!-- Location Marker: Walled City / Solitude -->
          <span class="compass-marker marker--city" title="Cidade Fortificada Nórdica">
            <svg viewBox="0 0 16 16" width="13" height="13" fill="currentColor">
              <path d="M2 14 V7 L4 5 V4 L5 4 V5 L7 5 V4 L8 4 V5 L10 5 V4 L11 4 V5 L12 5 V4 L13 4 V5 L14 7 V14 Z M6 9 H10 V14 H6 Z" />
            </svg>
          </span>

          <span class="tape-tick">.</span>
          <span class="tape-point">E</span>
          <span class="tape-tick">|</span>
          <span class="tape-point">SE</span>
          <span class="tape-tick">.</span>
        </div>
      </div>
    </div>

    <!-- Right Nordic Interlace Knot Wing -->
    <div class="skyrim-knot-wing skyrim-knot-wing--right" aria-hidden="true">
      <svg viewBox="0 0 160 20" width="160" height="20" fill="none" stroke="currentColor">
        <path d="M160 10 H80 Q60 2 40 10 T0 10" stroke-width="1" stroke-opacity="0.3" />
        <path d="M60 4 Q45 16 30 4 T0 10" stroke-width="0.75" stroke-opacity="0.5" />
        <circle cx="4" cy="10" r="2.5" fill="currentColor" fill-opacity="0.6" />
      </svg>
    </div>
  </div>

  <!-- =========================================================================
       2. Main Skyrim HUD Interface (Dovahkiin Profile, Stat Bars, Controls & Nav)
       ========================================================================= -->
  <div class="site-header__inner skyrim-hud-inner">
    <!-- Left: Dovahkiin Player Profile & The 3 Skyrim Stat Bars -->
    <div class="header-hud skyrim-player-hud">
      <!-- Dragon Crest & GitHub Link -->
      <a
        href="https://github.com/Cristofer-Vargas"
        class="brand-github skyrim-brand-dragon"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Perfil do GitHub de Cristofer Vargas (Dovahkiin)"
        title="Cristofer Vargas // Dovahkiin - Abrir GitHub"
      >
        <!-- Authentic Nordic Imperial Dragon Crest Frame SVG -->
        <div class="skyrim-dragon-emblem" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="46" height="46" fill="currentColor">
            <!-- Nordic Dragon Silhouette & Wings -->
            <path d="M24 2 C22 5 19 8 16 11 C12 15 6 18 3 24 C8 24 13 22 17 19 C15 23 12 28 8 32 C13 31 18 28 22 24 C21 28 19 33 16 38 C20 36 23 32 24 28 C25 32 28 36 32 38 C29 33 27 28 26 24 C30 28 35 31 40 32 C36 28 33 23 31 19 C35 22 40 24 45 24 C42 18 36 15 32 11 C29 8 26 5 24 2 Z" opacity="0.9" />
            <!-- Central Diamond Jewel & Dragon Eye -->
            <polygon points="24,14 27,20 24,26 21,20" fill="#e5c158" />
            <polygon points="24,28 26,33 24,38 22,33" fill="#e5c158" />
            <circle cx="24" cy="9" r="1.5" fill="#ffffff" />
          </svg>
        </div>

        <svg class="skyrim-github-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12Z" />
        </svg>
      </a>

      <!-- Player Titles & Authentic Skyrim Vitals (Magicka / Health / Stamina) -->
      <div class="player-status skyrim-player-status">
        <div class="player-tag skyrim-player-tag">
          <span class="skyrim-level-badge" title="Nível de Personagem / Skill Mastery">
            <span class="level-border"></span>
            <span class="level-num">NV.24</span>
          </span>
          <div class="skyrim-name-group">
            <div class="skyrim-title-row">
              <span class="skyrim-dragonborn-title">DOVAHKIIN</span>
              <span class="skyrim-sep-diamond">◆</span>
              <span class="skyrim-class-title">ARQUIMAGO &amp; FORJADOR</span>
            </div>
            <span class="player-name skyrim-player-name">CRISTOFER VARGAS</span>
          </div>
        </div>

        <!-- The 3 Classic Skyrim Stat Bars (Magicka, Health, Stamina) with Ornate Brackets -->
        <div class="skyrim-vitals-bars" aria-label="Barras de Magicka, Saúde e Vigor de Skyrim">
          <!-- 1. Magicka Bar (Sapphire Frost Blue) -->
          <div class="skyrim-stat-container stat--magicka" title="Magicka: 100/100 (Capacidade de Arquitetura &amp; Lógica)">
            <span class="stat-cap stat-cap--left" aria-hidden="true">‹</span>
            <div class="stat-bar-frame">
              <div class="stat-bar-fill fill--magicka"></div>
              <span class="stat-label">MAGICKA</span>
            </div>
            <span class="stat-cap stat-cap--right" aria-hidden="true">›</span>
          </div>

          <!-- 2. Health Bar (Crimson Blood Red) -->
          <div class="skyrim-stat-container stat--health" title="Health: 100/100 (Resiliência &amp; Estabilidade de Código)">
            <span class="stat-cap stat-cap--left" aria-hidden="true">‹</span>
            <div class="stat-bar-frame">
              <div class="stat-bar-fill fill--health"></div>
              <span class="stat-label">HEALTH</span>
            </div>
            <span class="stat-cap stat-cap--right" aria-hidden="true">›</span>
          </div>

          <!-- 3. Stamina Bar (Nordic Emerald Green) -->
          <div class="skyrim-stat-container stat--stamina" title="Stamina: 100/100 (Vigor &amp; Velocidade de Entrega)">
            <span class="stat-cap stat-cap--left" aria-hidden="true">‹</span>
            <div class="stat-bar-frame">
              <div class="stat-bar-fill fill--stamina"></div>
              <span class="stat-label">STAMINA</span>
            </div>
            <span class="stat-cap stat-cap--right" aria-hidden="true">›</span>
          </div>

          <!-- Dragon Souls Counter -->
          <div class="skyrim-dragon-souls" title="Almas de Dragão Absorvidas">
            <span class="dragon-soul-icon">🐉</span>
            <span class="dragon-soul-val">5 SOULS</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Right: Thu'um Nordic Horn Sound Toggle & Skyrim Quest Journal Navigation -->
    <div class="header-actions skyrim-header-actions">
      <!-- Nordic War Horn / Thu'um Sound Toggle -->
      <button
        type="button"
        class="sfx-toggle skyrim-thuum-btn"
        id="sfx-toggle"
        aria-label="Alternar áudio e efeitos sonoros nórdicos (Thu'um)"
        title="Thu'um // Berrante Nórdico e Efeitos Sonoros"
      >
        <!-- Carved Nordic Horn SVG -->
        <div class="thuum-horn-art" aria-hidden="true">
          <svg viewBox="0 0 28 24" width="22" height="20" fill="currentColor">
            <!-- Curved War Horn Shape -->
            <path d="M4 18 C8 17 14 15 18 10 C20 7 21 4 21 2 L25 3 C25 6 24 11 20 15 C15 21 8 22 3 21 Z" />
            <!-- Metal Runic Bands -->
            <path d="M10 16 L12 18 M16 11 L18 13 M20 5 L23 6" stroke="#e5c158" stroke-width="1.5" stroke-linecap="round" />
            <!-- Horn Mouthpiece -->
            <circle cx="3.5" cy="19.5" r="2" fill="#e5c158" />
          </svg>
        </div>

        <!-- Sonic Dragon Shout Waves -->
        <div class="thuum-shout-waves" aria-hidden="true">
          <span class="wave wave--1"></span>
          <span class="wave wave--2"></span>
          <span class="wave wave--3"></span>
        </div>

        <span class="sfx-icon" id="sfx-icon" aria-hidden="true" style="display: none;">🔊</span>
        <div class="thuum-label-group">
          <span class="thuum-subtitle">THU'UM</span>
          <span class="sfx-label skyrim-sfx-label" id="sfx-label">SFX: ON</span>
        </div>
      </button>

      <!-- Mobile Nordic Shield Menu Toggle -->
      <button
        type="button"
        class="menu-toggle skyrim-menu-btn"
        id="menu-toggle"
        aria-expanded="false"
        aria-controls="primary-nav"
        aria-label="Abrir menu de missões nórdico"
      >
        <span class="skyrim-menu-seal" aria-hidden="true">
          <!-- Crossed Nordic Axes / Rune Mark -->
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor">
            <path d="M4 4 L20 20 M20 4 L4 20" stroke-width="1.8" stroke-linecap="round" />
            <circle cx="12" cy="12" r="3" fill="#e5c158" stroke="none" />
          </svg>
        </span>
        <span class="menu-toggle__text skyrim-menu-text">QUESTS</span>
      </button>

      <!-- Skyrim Quest Journal & Constellation Navigation -->
      <nav class="primary-nav skyrim-primary-nav" id="primary-nav" aria-label="Navegação de Missões de Skyrim">
        <div class="nav-dragon-seal-top" aria-hidden="true">
          <span>᛭ QUEST JOURNAL // MISSIO DOVAH ᛭</span>
        </div>

        <a href="#sobre" class="nav-link skyrim-nav-item">
          <span class="nav-rune">ᚱ</span>
          <span class="nav-title">Bio</span>
          <span class="nav-diamond-pip" aria-hidden="true">◆</span>
        </a>

        <a href="#trajetoria" class="nav-link skyrim-nav-item">
          <span class="nav-rune">ᛏ</span>
          <span class="nav-title">Crônicas</span>
          <span class="nav-diamond-pip" aria-hidden="true">◆</span>
        </a>

        <a href="#projetos" class="nav-link skyrim-nav-item">
          <span class="nav-rune">ᛒ</span>
          <span class="nav-title">Artefatos</span>
          <span class="nav-diamond-pip" aria-hidden="true">◆</span>
        </a>

        <a href="#tecnologias" class="nav-link skyrim-nav-item">
          <span class="nav-rune">ᚠ</span>
          <span class="nav-title">Forja</span>
          <span class="nav-diamond-pip" aria-hidden="true">◆</span>
        </a>

        <a href="#contato" class="nav-link nav-link--highlight skyrim-nav-item skyrim-nav-item--corvo">
          <span class="nav-rune">ᛗ</span>
          <span class="nav-title">Corvo ↗</span>
          <span class="nav-quest-marker" aria-hidden="true">
            <svg viewBox="0 0 10 12" width="10" height="12" fill="currentColor">
              <polygon points="5,1 9,6 5,11 1,6" />
            </svg>
          </span>
        </a>
      </nav>
    </div>
  </div>

  <!-- Bottom Nordic Knotwork & Rune Tracing Rail -->
  <div class="skyrim-hud-bottom-rail" aria-hidden="true">
    <div class="skyrim-rail-border"></div>
    <div class="skyrim-rail-center-diamond">
      <span>◆</span>
    </div>
  </div>
</header>

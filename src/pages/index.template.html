          "address": {

          "alumniOf": [

              "@type": "EducationalOrganization",
              "name": "Uninter — Análise e Desenvolvimento de Sistemas"

            }

          "inLanguage": "pt-BR",
          "author": {
            "@id": "https://cristofer-vargas.github.io/cristofer-portifolio/#person"

        {

          "name": "Projetos Destaque",

            },
            {
              "@type": "CreativeWork",
              "position": 2,
              "name": "D’Santis Food Truck",

              "author": {
                "@id": "https://cristofer-vargas.github.io/cristofer-portifolio/#person"

<body>
  <!-- Subtle grain overlay across the canvas -->
  <div class="noise-overlay" aria-hidden="true"></div>

  <!-- Pixel-art castle & moon hero backdrop -->
  <div class="hero-backdrop" aria-hidden="true">
    <img src="assets/images/hero-castle.jpg" alt="" class="hero-backdrop__img">
    <div class="hero-backdrop__fade"></div>
  </div>

  {{component:header}}

  <!-- Centered 1200px Page Shell -->
  <div class="page-shell">
    <main>
      {{component:hero}}
      {{component:about}}
      {{component:timeline}}
      {{component:projects}}
      {{component:technologies}}
      {{component:contact}}
    </main>

    {{component:footer}}
  </div>

  <script type="module" src="src/js/app.js"></script>
</body>
